  <section class="page-hero">
    <div class="container">
      <p class="page-eyebrow reveal">Blog</p>
      <h1 class="page-title reveal">博客文章</h1>
      <p class="page-desc reveal">技术笔记、学习心得与生活记录。支持按分类、标签筛选，也可以搜索标题和正文。</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="blog-toolbar reveal">
        <div class="search-box">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="search" id="blog-search" placeholder="搜索文章标题或内容…" autocomplete="off">
          <button class="search-clear" id="search-clear" type="button" aria-label="清空搜索">×</button>
        </div>
        <div class="filter-group">
          <span class="filter-label">分类</span>
          <div class="filter-chips" id="category-filters">
            {{CATEGORY_CHIPS}}
          </div>
        </div>
        <div class="filter-group">
          <span class="filter-label">标签</span>
          <div class="filter-chips" id="tag-filters">
            {{TAG_CHIPS}}
          </div>
        </div>
        <p class="search-status" id="search-status"></p>
      </div>
      <div class="post-list" id="post-list">
        <!-- POST_LIST -->
      </div>
      <div class="search-empty" id="search-empty" hidden>
        <p>没有找到符合条件的文章，换个关键词或筛选条件试试？</p>
      </div>
    </div>
  </section>

  <script type="application/json" id="search-index">{{SEARCH_INDEX}}</script>
  <script src="{{BASE}}assets/js/search.js" defer></script>

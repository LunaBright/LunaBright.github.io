  <section class="hero">
    <div class="hero-inner">
      <img class="avatar" src="{{AVATAR}}" alt="{{AUTHOR}} 的头像">
      <p class="hero-greet">你好，我是</p>
      <h1 class="hero-name"><span class="gradient-text">{{AUTHOR}}</span></h1>
      <p class="hero-tagline">{{TAGLINE}}</p>
      <p class="hero-desc">{{HERO_DESC}}</p>
      <div class="hero-actions">
        <a class="btn btn-primary" href="{{BASE}}blog/index.html">阅读博客</a>
        <a class="btn btn-outline" href="#contact">联系我</a>
      </div>
    </div>
  </section>

  <section class="section" id="about">
    <div class="container">
      <h2 class="section-title reveal">关于我<span class="section-mark">#</span></h2>
      <div class="about-grid">
        <div class="about-text">
          {{ABOUT_PARAGRAPHS}}
          <p class="about-edit-tip reveal">💡 这些文字都可以在后台「站点设置」里直接修改，无需改代码。</p>
        </div>
        <div class="about-card reveal">
          <h3>基本信息</h3>
          <ul>
            <li><span>昵称</span><b>{{AUTHOR}}</b></li>
            <li><span>邮箱</span><b>{{EMAIL}}</b></li>
            <li><span>GitHub</span><b>{{GITHUB}}</b></li>
          </ul>
        </div>
      </div>
    </div>
  </section>

  <section class="section section-soft" id="skills">
    <div class="container">
      <h2 class="section-title reveal">技能与兴趣<span class="section-mark">#</span></h2>
      <div class="chips">
        {{SKILL_CHIPS}}
      </div>
    </div>
  </section>

  <section class="section" id="blog">
    <div class="container">
      <div class="section-head reveal">
        <h2 class="section-title">最新文章<span class="section-mark">#</span></h2>
        <a class="section-more" href="{{BASE}}blog/index.html">查看全部 →</a>
      </div>
      <div class="post-grid">
        <!-- RECENT_POSTS -->
      </div>
    </div>
  </section>

  <section class="section section-soft" id="contact">
    <div class="container">
      <h2 class="section-title reveal">联系我<span class="section-mark">#</span></h2>
      <p class="contact-desc reveal">想和我交流？欢迎通过以下方式找到我。</p>
      <div class="contact-links">
        {{CONTACT_CARDS}}
      </div>
    </div>
  </section>
